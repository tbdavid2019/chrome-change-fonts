<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>網站規則管理 - 改字體 333</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: 'JetBrains Mono', 'Gen Jyuu Gothic', 'Noto Sans TC', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      --saffron: #ffb010;
      --deep-blue: #17324d;
      --deep-blue-dark: #0f2337;
      --clay: #a9471d;
      --clay-dark: #8f3511;
      --warm-cream: #fff9e8;
      --canvas: #fff0cc;
      --ink: #2b251a;

      --bg-page: var(--canvas);
      --card-bg: var(--warm-cream);
      --card-elevated: #fffefa;
      --card-muted: #fcf4e0;

      --border-subtle: #e2cca0;
      --border-default: #d6bc7c;
      --border-strong: #a48645;
      --border-focus: var(--deep-blue);

      --text-main: var(--ink);
      --text-muted: #594e36;
      --text-heading: var(--deep-blue-dark);

      --badge-bg: #ffe499;
      --badge-text: var(--deep-blue-dark);
      --badge-border: #d6bc7c;

      --btn-primary-bg: var(--deep-blue);
      --btn-primary-text: #ffffff;
      --btn-danger-bg: var(--card-muted);
      --btn-danger-text: var(--clay-dark);
      --btn-danger-border: #c9ab69;

      --input-bg: #fffefa;
      --input-border: #947530;
      --input-text: var(--ink);

      --status-active: #1b5329;
      --status-error: #8f3511;
      --shadow-sm: 0 2px 8px rgba(43, 37, 26, 0.08);
      --focus-ring: 0 0 0 2px var(--card-bg), 0 0 0 4px var(--border-focus);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #0c1927;
        --card-bg: #13273c;
        --card-elevated: #1b3450;
        --card-muted: #172e47;

        --border-subtle: #24415f;
        --border-default: #2b4a6b;
        --border-strong: #3e6a98;
        --border-focus: var(--saffron);

        --text-main: #fff9e8;
        --text-muted: #cbd5e1;
        --text-heading: var(--saffron);

        --badge-bg: #1b3450;
        --badge-text: var(--saffron);
        --badge-border: #3e6a98;

        --btn-primary-bg: var(--saffron);
        --btn-primary-text: #0c1927;
        --btn-danger-bg: #1b3450;
        --btn-danger-text: #f08354;
        --btn-danger-border: #3e6a98;

        --input-bg: #1b3450;
        --input-border: #548bc4;
        --input-text: #fff9e8;

        --status-active: #6ee7b7;
        --status-error: #f87171;
        --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.35);
        --focus-ring: 0 0 0 2px var(--card-bg), 0 0 0 4px var(--border-focus);
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 40px;
      background: var(--bg-page);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .page-shell {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--card-bg);
      border: 1px solid var(--border-default);
      border-radius: 14px;
      padding: 14px 18px;
      box-shadow: var(--shadow-sm);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--saffron);
      color: #0c1927;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1.5px solid var(--deep-blue-dark);
    }

    .top-header h1 {
      margin: 0;
      font-size: 20px;
      color: var(--text-heading);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--border-strong);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      background: var(--card-elevated);
      color: var(--text-heading);
      min-height: 34px;
    }

    .pill-btn:hover {
      background: var(--saffron);
      color: #0c1927;
      border-color: var(--saffron);
    }

    .status-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--card-bg);
      border: 1px solid var(--border-default);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .status-msg.is-ok {
      color: var(--status-active);
      font-weight: 600;
    }

    .status-msg.is-error {
      color: var(--status-error);
      font-weight: 600;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-default);
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title-row h2 {
      margin: 0;
      font-size: 17px;
      color: var(--text-heading);
    }

    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid var(--badge-border);
    }

    .row-form {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
      background: var(--card-muted);
      border: 1px solid var(--border-default);
      border-radius: 10px;
      padding: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field[hidden] {
      display: none;
    }

    .field label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    input[type="text"],
    input[type="search"],
    select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1.5px solid var(--input-border);
      background: var(--input-bg);
      color: var(--input-text);
      font-size: 13.5px;
      font-family: inherit;
      min-height: 36px;
    }

    .row-form input[type="text"],
    .row-form input[type="search"] {
      flex: 1;
      min-width: 180px;
    }

    input:focus-visible,
    select:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    .btn {
      border: 1px solid var(--btn-danger-border);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      min-height: 36px;
      background: var(--card-elevated);
      color: var(--text-heading);
    }

    .btn-primary {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      border-color: var(--btn-primary-bg);
    }

    .btn-danger {
      background: var(--btn-danger-bg);
      color: var(--btn-danger-text);
      border-color: var(--btn-danger-border);
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
      min-height: 28px;
    }

    .form-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .site-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .site-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--card-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .site-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      flex: 1;
    }

    .site-host {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-heading);
      word-break: break-all;
    }

    .site-detail {
      font-size: 12.5px;
      color: var(--text-muted);
      word-break: break-word;
    }

    .site-item-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .empty-msg {
      margin: 0;
      padding: 14px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      background: var(--card-muted);
      border-radius: 10px;
      border: 1px dashed var(--border-default);
    }

    .empty-msg[hidden],
    .btn[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="top-header">
      <div class="brand-group">
        <span class="brand-badge" aria-hidden="true">333</span>
        <h1 id="optionsHeading">網站規則管理</h1>
      </div>
      <div class="header-actions">
        <a class="pill-btn" id="optionsFeedbackLink" href="https://david888.com/contact" target="_blank" rel="noopener noreferrer">意見反應</a>
        <button type="button" class="pill-btn" id="optionsLangToggle">EN</button>
      </div>
    </header>

    <div class="status-banner">
      <span class="status-msg" id="optionsStatusMsg">已同步設定。</span>
      <span id="optionsQuotaText">0 / 502</span>
    </div>

    <section class="card">
      <div class="card-header">
        <div class="card-title-row">
          <h2 id="excludedHeading">已排除的網站（套用 OFF）</h2>
          <span class="count-badge" id="excludedCountBadge">0</span>
        </div>
        <button type="button" class="btn btn-danger btn-sm" id="clearAllExcludedBtn">全部移除</button>
      </div>

      <div class="row-form">
        <input type="text" id="addExcludedInput" placeholder="輸入網域或網址，例如 example.com">
        <button type="button" class="btn btn-primary" id="addExcludedBtn">加入排除</button>
        <input type="search" id="excludedSearchInput" placeholder="搜尋已排除網站">
      </div>

      <p class="empty-msg" id="excludedEmpty">目前沒有已排除的網站。</p>
      <ul class="site-list" id="excludedList"></ul>
    </section>

    <section class="card">
      <div class="card-header">
        <div class="card-title-row">
          <h2 id="siteFontHeading">特定網站專用字體</h2>
          <span class="count-badge" id="siteFontCountBadge">0</span>
        </div>
        <input type="search" id="siteFontSearchInput" placeholder="搜尋網站字體規則" style="max-width: 240px;">
      </div>

      <div class="grid-form">
        <div class="field">
          <label for="siteFontHostInput" id="siteFontHostLabel">網站網域或網址</label>
          <input type="text" id="siteFontHostInput" placeholder="例如 github.com">
        </div>
        <div class="field">
          <label for="siteFontModeSelect" id="siteFontModeLabel">模式</label>
          <select id="siteFontModeSelect">
            <option value="basic">單一字體</option>
            <option value="advanced">CJK / 英數分開</option>
          </select>
        </div>
        <div class="field" id="siteBasicFontField">
          <label for="siteBasicFontSelect" id="siteBasicFontLabel">字體</label>
          <select id="siteBasicFontSelect"></select>
        </div>
        <div class="field" id="siteCjkFontField" hidden>
          <label for="siteCjkFontSelect" id="siteCjkFontLabel">CJK（中日韓）</label>
          <select id="siteCjkFontSelect"></select>
        </div>
        <div class="field" id="siteLatinFontField" hidden>
          <label for="siteLatinFontSelect" id="siteLatinFontLabel">非 CJK（英數與標點）</label>
          <select id="siteLatinFontSelect"></select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn" id="cancelEditSiteFontBtn" hidden>取消編輯</button>
          <button type="button" class="btn btn-primary" id="saveSiteFontBtn">儲存網站字體</button>
        </div>
      </div>

      <p class="empty-msg" id="siteFontEmpty">目前沒有特定網站專用字體規則。</p>
      <ul class="site-list" id="siteFontList"></ul>
    </section>
  </div>

  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
